<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camille Le Bihan</title>
<style>
@font-face{font-family:IT;src:url(assets/InterTight.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000}
body{display:grid;place-items:center;font-family:IT,system-ui,sans-serif;color:#111}
.stage{position:relative;width:1000px;height:620px;transform-origin:center;cursor:none;overflow:hidden;border-radius:14px}
canvas{position:absolute;inset:0}
.t{position:absolute;pointer-events:none}
.name{left:40px;top:25px;font-weight:620;font-size:13px}
.nav{right:40px;top:25px;display:flex;gap:26px;font-weight:430;font-size:10.5px;letter-spacing:.04em}
h1{left:40px;top:96px;font-weight:350;font-size:54px;line-height:56px;letter-spacing:-.035em}
.blurb{left:690px;top:509px;font-weight:430;font-size:11px;line-height:15px}
.cur{position:absolute;left:0;top:0;pointer-events:none;width:24px;height:24px;transform:translate(-100px,-100px)}
</style></head><body>
<div class="stage" id="stage">
  <canvas id="cv" width="2000" height="1240" style="width:1000px;height:620px"></canvas>
  <div class="t name">Camille Le Bihan</div>
  <div class="t nav"><span>USA</span><span>FRANCE</span><span>UK</span><span>SPAIN</span><span>NETHERLANDS</span></div>
  <h1 class="t">Curiosity<br>compounds.</h1>
  <div class="t blurb">Finance, venture and deep tech.<br>Working on growth, innovation,<br>scale and strategy — Paris-based.</div>
  <svg class="cur" id="cur" viewBox="-4 -7 20 28"><path d="M -3 -6 L 13 9 L 5 9.5 L 9.5 18 L 6 19.5 L 1.6 11 L -3 15.5 Z" fill="#111" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>
</div>
<script>
(() => {
  const C = 20, COLS = 50, ROWS = 31;
  const g = ["00000000000000000000000000000000000000000000000000", "00000000000000000000000000000000000000000000000000", "00000000000000000000000000000000000000000000000000", "00000000000000000000000000000000000000000000000000", "00000000000000000000000000000000000000000000001001", "00000000000000000000000000000000100000000100100011", "00000000000000000000000000000001000011000010101111", "00000000000000000000000000000000000010011111111111", "00000000000000000000000000000000111111101111011111", "00000000000000000000000000000100011111111111111111", "00000000000000000000000000100111111111111111111111", "00000000000000000000000001101111111111111111111111", "00000000000000000000000011001111111111111111111111", "00000000010111101000000111111111111111111111111111", "00000010111111111111111111111111111111111111111110", "00000001111111111111111111111111111111111111111000", "10000001111111111111111111111111111111111111111100", "01000111111111111111111111111111111111111111110010", "00100011111111111111111111111111111111111111110010", "11110111111111111111111111111111111111111111100000", "11101111111111111111111111110110011011111100000000", "11111111111111111111111110001000001000011000000000", "11111110111111111111110001000000000000000000000000", "11111111111111011111000000000000000000000000000000", "11111111111011111110000000000000000000000000000000", "11111111101011001100000000000000000000000000000000", "11111101110000000000000000000000000000000000000000", "11111111101000000000000000000000000000000000000000", "11110110110000000000000000000000000000000000000000", "01011100100000000000000000000000000000000000000000", "00100000000000000000000000000000000000000000000000"].map(r => [...r].map(Number));
  const protect = (c, r) => r < 3 || (c >= 1 && c < 20 && r >= 3 && r < 12) || (c >= 33 && r >= 23);
  const cv = document.getElementById('cv'), x = cv.getContext('2d'); x.scale(2, 2);
  let hover = null;
  function draw() {
    x.fillStyle = '#E4E4E2'; x.fillRect(0, 0, 1000, 620);
    x.font = '430 8.5px IT, sans-serif'; x.textBaseline = 'alphabetic';
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (g[r][c]) { x.fillStyle = '#202020'; x.fillRect(c * C, r * C, C, C); continue; }
      let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if ((dx || dy) && g[r + dy] && g[r + dy][c + dx]) n++;
      if (n) { x.fillStyle = '#8C8C88'; x.fillText(n, c * C + 3, r * C + 9.5); }
    }
    if (hover) { x.save(); x.shadowColor = '#1C2A8F'; x.shadowBlur = 26; x.fillStyle = 'rgba(28,42,143,.55)'; x.fillRect(hover[0] * C - 10, hover[1] * C - 10, C + 20, C + 20); x.restore(); }
  }
  const stage = document.getElementById('stage'), cur = document.getElementById('cur');
  function paint(px, py) {
    const c = Math.floor(px / C), r = Math.floor(py / C);
    hover = [c, r];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cc = c + dx, rr = r + dy;
      if (cc < 0 || rr < 0 || cc >= COLS || rr >= ROWS || protect(cc, rr)) continue;
      if (Math.abs(dx) + Math.abs(dy) < 2 || Math.random() < .35) g[rr][cc] = 1;
    }
    cur.style.transform = `translate(${px - 2}px,${py - 2}px)`;
    draw();
  }
  let scale = 1;
  stage.addEventListener('pointermove', e => { const b = stage.getBoundingClientRect(); paint((e.clientX - b.left) / scale, (e.clientY - b.top) / scale); });
  stage.addEventListener('pointerleave', () => { hover = null; cur.style.transform = 'translate(-100px,-100px)'; draw(); });
  stage.addEventListener('dblclick', () => location.reload());
  const fit = () => { scale = Math.min(innerWidth / 1000, innerHeight / 620) * .96; stage.style.transform = `scale(${scale})`; };
  addEventListener('resize', fit); fit();
  document.fonts.ready.then(draw); draw();
})();
</script></body></html>
